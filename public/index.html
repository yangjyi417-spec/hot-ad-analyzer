<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热点广告分析 · 技能工作台</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a22; --panel2:#1e222c; --line:#2a2f3a;
    --txt:#e6e8ee; --sub:#9aa3b2; --accent:#4d8cff; --good:#22c07a; --warn:#f2b632; --bad:#ff5c5c;
    --c1:#4d8cff; --c2:#22c07a; --c3:#c07bff; --c4:#f2b632;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
  a{color:var(--accent);text-decoration:none}

  /* Top bar */
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-size:18px;font-weight:700;letter-spacing:.5px}
  .brand small{display:block;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:2px}
  .badge{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
  .badge.llm{color:var(--good);border-color:var(--good)}
  .badge.local{color:var(--warn);border-color:var(--warn)}
  .spacer{flex:1}
  .src-tabs{display:flex;gap:8px}
  .src-tabs button{background:var(--panel);border:1px solid var(--line);color:var(--sub);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  .src-tabs button.on{color:#fff;border-color:var(--accent);background:rgba(77,140,255,.14)}
  .btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--txt);font-weight:400}
  .btn:disabled{opacity:.5;cursor:default}

  main{max-width:1320px;margin:0 auto;padding:22px}
  .intro{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
  .intro h2{font-size:15px;margin-bottom:6px}
  .intro p{font-size:13px;color:var(--sub)}
  .flow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .flow span{font-size:12px;color:var(--txt);background:var(--panel2);border:1px solid var(--line);padding:5px 12px;border-radius:8px}
  .flow b{color:var(--accent)}

  .manual{display:flex;gap:8px;margin-top:12px}
  .manual input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:8px;font-size:13px}

  /* Hot pool */
  .grid-title{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
  .grid-title h3{font-size:14px}
  .grid-title .cnt{font-size:12px;color:var(--sub)}
  .arc-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .arc-bar select,.arc-bar input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:8px;font-size:13px}
  .arc-bar input{flex:1;min-width:180px}
  .pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;position:relative}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .rank{position:absolute;top:12px;right:14px;font-size:12px;color:var(--sub);font-weight:700}
  .card .plat{font-size:11px;color:var(--accent);margin-bottom:6px}
  .card .tt{font-size:14px;font-weight:600;margin-bottom:8px;padding-right:26px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;align-items:center}
  .card .meta .heat{color:var(--warn)}
  .card .ex{font-size:12px;color:var(--sub);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .date{font-size:11.5px;color:var(--sub);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .loading,.err{padding:24px;text-align:center;color:var(--sub);font-size:13px;grid-column:1/-1}
  .err{color:var(--bad)}
  .prog{max-width:360px;margin:0 auto;height:6px;border-radius:999px;background:var(--panel2);overflow:hidden;position:relative}
  .prog i{position:absolute;top:0;left:0;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7fb0ff);animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

  /* Report */
  #report{display:none}
  #report.show{display:block}
  .rhead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .rhead .back{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .rhead .rt{font-size:16px;font-weight:700;flex:1;min-width:200px}

  .decision{display:grid;grid-template-columns:auto 1fr;gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;align-items:center}
  .score-ring{text-align:center}
  .score-ring .num{font-size:44px;font-weight:800;line-height:1}
  .score-ring .lbl{font-size:12px;color:var(--sub);margin-top:4px}
  .verdict .v{font-size:22px;font-weight:800;margin-bottom:6px}
  .verdict .light{display:inline-block;padding:2px 10px;border-radius:6px;font-size:12px;font-weight:700;margin-left:8px;vertical-align:middle}
  .light.green{background:rgba(34,192,122,.18);color:var(--good)}
  .light.yellow{background:rgba(242,182,50,.18);color:var(--warn)}
  .light.red{background:rgba(255,92,92,.18);color:var(--bad)}
  .verdict p{font-size:13px;color:var(--sub)}
  .v.green{color:var(--good)} .v.yellow{color:var(--warn)} .v.red{color:var(--bad)}

  .rgrid{display:flex;flex-direction:column;gap:16px;margin-bottom:16px}
  .rgrid .panel.radar{display:flex;flex-direction:column;align-items:center}
  .rgrid .panel.radar svg{max-width:100%;height:auto}

  .shotbox{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
  .shotbox .shotthumb{flex:0 0 auto}
  .shotimg{width:230px;max-width:45vw;border:1px solid var(--line);border-radius:10px;display:block;cursor:zoom-in;background:var(--panel2);transition:border-color .15s,transform .1s}
  .shotimg:hover{border-color:var(--accent)}
  .shotmeta{font-size:11px;color:var(--sub);margin-top:6px}
  .ovwwrap{flex:1 1 320px;min-width:260px}
  .ovwt{font-size:12px;color:var(--sub);letter-spacing:1px;margin-bottom:8px;font-weight:600}
  .ovw{font-size:14px;color:#d3d9e3;line-height:1.95;text-align:justify;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:14px 16px}
  .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .fact{font-size:12px;color:#c4cad6;background:rgba(77,140,255,.10);border:1px solid rgba(77,140,255,.22);padding:3px 10px;border-radius:7px}
  .caution{font-size:12px;color:var(--warn);background:rgba(242,182,50,.12);border:1px solid var(--warn);padding:6px 12px;border-radius:8px;margin-top:12px}
  .caution::before{content:"⚠ ";}
  .shotfail{font-size:12px;color:var(--sub);background:var(--panel2);border:1px dashed var(--line);padding:8px 12px;border-radius:8px;margin-bottom:16px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .panel h4{font-size:13px;color:var(--sub);margin-bottom:12px;letter-spacing:1px}
  svg{display:block;margin:0 auto;overflow:visible}

  .dim-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:10px}
  .dim{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel2)}
  .dim.active{border-color:var(--accent)}
  .dim .dh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .dim .dot{width:9px;height:9px;border-radius:50%}
  .dim .dn{font-size:15px;font-weight:700}
  .dim .gg{font-size:11px;color:var(--sub)}
  .dim .an{font-size:14.5px;color:#d3d9e3;line-height:1.9}
  .dim .q{font-size:11.5px;color:var(--sub);margin-bottom:6px}
  .dim .tag{margin-left:auto;font-size:11px;color:var(--accent);background:rgba(77,140,255,.12);padding:1px 8px;border-radius:5px}

  .glist{display:flex;flex-direction:column;gap:18px}
  .gsec{border-left:2px solid var(--line);padding-left:16px}
  .gsh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);letter-spacing:1px;margin-bottom:8px;font-weight:600}
  .gsh .dot{width:9px;height:9px;border-radius:50%}
  .gpara{font-size:14.5px;color:#d3d9e3;line-height:2.0;text-align:justify}
  .seg{transition:background .15s;border-radius:6px;padding:1px 4px;margin:0 -4px}
  .seg.active{background:rgba(77,140,255,.14)}
  .seg b{color:var(--txt);font-weight:700}
  .stag{font-style:normal;font-size:11px;color:var(--accent);background:rgba(77,140,255,.12);padding:1px 7px;border-radius:5px;margin:0 4px}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .sug li,.rk li{list-style:none;font-size:13px;color:#c4cad6;padding:7px 0;border-bottom:1px dashed var(--line)}
  .sug li:last-child,.rk li:last-child{border:none}
  .sug li b{color:var(--txt)}
  .kv{font-size:13px;color:#c4cad6}
  .kv b{color:var(--txt)}
  .rk-point{display:flex;gap:8px}
  .rk-point::before{content:"⚠";color:var(--warn)}

  .foot{font-size:11.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
  .foot a{margin-right:10px}
  .warnllm{background:rgba(242,182,50,.12);border:1px solid var(--warn);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:14px}

  @media(max-width:820px){
    .rgrid,.two,.decision{grid-template-columns:1fr}
    .score-ring{align-self:center}
    svg{max-width:100%}
    header{gap:10px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">热点广告分析 · 技能工作台<small>HOT-SPOT AD ANALYSIS ENGINE · 12 DIMENSIONS</small></div>
  <span id="modeBadge" class="badge local">检测中…</span>
  <div class="spacer"></div>
  <div class="src-tabs">
    <button data-src="all" class="on">全部</button>
    <button data-src="juhe">全网热搜</button>
    <button data-src="juhe_news">新闻榜单</button>
    <button data-src="juhe_brief">AI简报</button>
    <button data-src="weibo">微博热搜</button>
    <button data-src="bilibili">B站热门</button>
  </div>
  <button class="btn ghost" id="archiveToggle">📅 历史归档</button>
  <button class="btn" id="refresh">刷新热点池</button>
</header>

<main>
  <section class="intro" id="intro">
    <h2>把"刷热点"变成方法论</h2>
    <p>抓取多平台实时热点 → AI 从传播 / 受众 / 创意 / 媒介 四大环节的 12 个广告学维度自动拆解 → 一键生成可交互分析报告，结论按「时效 &gt; 风险 &gt; 契合」加权算出借势指数。</p>
    <div class="flow">
      <span><b>1</b> 抓取真实热点</span><span><b>2</b> 选择一条 / 手动粘贴</span><span><b>3</b> 12 维 AI 拆解</span><span><b>4</b> 可交互报告 + 借势指数</span>
    </div>
    <div class="manual">
      <input id="manualIn" placeholder="也可以手动粘贴任意热点标题，回车直接分析（例：某品牌联名翻车）">
      <button class="btn ghost" id="manualBtn">分析它</button>
    </div>
  </section>

  <div id="poolView">
    <div class="grid-title"><h3>今日热点池</h3><span class="cnt" id="poolCnt">点击任意热点开始分析</span></div>
    <div class="pool" id="pool"><div class="loading">正在抓取实时热点…</div></div>
  </div>

  <section id="archiveView" style="display:none">
    <div class="grid-title">
      <h3>历史归档</h3>
      <button class="back" id="arcBack" style="background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12px">← 返回实时热点</button>
      <span class="cnt" id="arcCnt"></span>
    </div>
    <div class="arc-bar">
      <select id="arcDate"></select>
      <select id="arcCat"><option value="all">全部分类</option></select>
      <input id="arcQ" placeholder="搜索标题 / 摘要 / 分类关键词">
      <button class="btn" id="arcGo">搜索</button>
    </div>
    <div class="pool" id="arcPool"><div class="loading">加载归档…</div></div>
  </section>

  <section id="report"></section>
</main>

<script>
const GROUP_COLOR = {传播:'var(--c1)',受众:'var(--c2)',创意:'var(--c3)',媒介:'var(--c4)'};
const GROUP_EN = {传播:'传播 Communication',受众:'受众 Audience',创意:'创意 Creative',媒介:'媒介 Media'};
let lastHot = null;

// ---- 模式徽章 ----
fetch('/api/config').then(r=>r.json()).then(c=>{
  const b = document.getElementById('modeBadge');
  if(c.llmOn){ b.className='badge llm'; b.textContent='● 大模型已接入 · '+(c.model||''); }
  else { b.className='badge local'; b.textContent='● 本地引擎模式（填 GLM Key 升级为 AI 拆解）'; }
}).catch(()=>{});

// ---- 抓取热点 ----
async function loadPool(src){
  document.getElementById('pool').innerHTML='<div class="loading">正在抓取实时热点…</div>';
  try{
    const r = await fetch('/api/hot?source='+src);
    const d = await r.json();
    let list=[]; const cap=[];
    if(d.juhe){ list=list.concat(d.juhe); cap.push('全网 '+d.juhe.length+' 条'); }
    if(d.juheNews){ list=list.concat(d.juheNews); cap.push('新闻 '+d.juheNews.length+' 条'); }
    if(d.juheBrief){ list=list.concat(d.juheBrief); cap.push('简报 '+d.juheBrief.length+' 条'); }
    if(d.weibo){ list=list.concat(d.weibo); cap.push('微博 '+d.weibo.length+' 条'); }
    if(d.bilibili){ list=list.concat(d.bilibili); cap.push('B站 '+d.bilibili.length+' 条'); }
    if(d.juheError) cap.push('全网抓取失败');
    if(d.juheNewsError) cap.push('新闻抓取失败');
    if(d.juheBriefError) cap.push('简报抓取失败');
    if(d.weiboError) cap.push('微博抓取失败');
    if(d.bilibiliError) cap.push('B站抓取失败');
    document.getElementById('poolCnt').textContent=cap.join(' · ')+' ｜点击任意热点开始分析';
    if(!list.length){ document.getElementById('pool').innerHTML='<div class="err">未抓到热点数据（可能被限频）。可稍后刷新，或手动粘贴标题分析。</div>'; return; }
    renderPool(list);
  }catch(e){ document.getElementById('pool').innerHTML='<div class="err">抓取失败：'+e.message+'</div>'; }
}
function renderPool(list, containerId){
  const p=document.getElementById(containerId||'pool'); p.innerHTML='';
  list.forEach(h=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="rank">#${h.rank}</div>
      <div class="plat">${h.sourceName}${h.analysis?' <span style="color:var(--good);font-size:10px">✓已分析</span>':''}</div>
      <div class="tt">${esc(h.title)}</div>
      ${h.extra?`<div class="ex">${esc(h.extra)}</div>`:''}
      <div class="meta"><span class="date">📅 ${esc(h.date||'实时')}</span><span class="heat">${esc(h.heatText||'')}</span></div>`;
    c.onclick=()=>analyze(h);
    p.appendChild(c);
  });
}

// ---- 分析 ----
let _analyzeTimer = null;
async function analyze(h, force, shot){
  lastHot=h;
  if(shot===undefined) shot=true;
  document.getElementById('poolView').style.display='none';
  document.getElementById('intro').style.display='none';
  const av=document.getElementById('archiveView'); if(av) av.style.display='none';
  const R=document.getElementById('report'); R.className='show';
  if(_analyzeTimer){ clearInterval(_analyzeTimer); _analyzeTimer=null; }
  const t0=Date.now();
  const stageMsg = shot
    ? '正在真实截图 → 读图生成内容概述 → 按 12 维拆解（首次约 20–40 秒）'
    : '正在按 12 维拆解…';
  R.innerHTML=`<div class="loading">
      <div style="font-size:14px;color:var(--txt);margin-bottom:12px">${esc(h.title)}</div>
      <div style="font-size:12.5px;color:var(--sub);margin-bottom:12px">${stageMsg}</div>
      <div class="prog"><i></i></div>
      <div id="elapsed" style="margin-top:12px;font-size:12px;color:var(--sub)">已用 0.0s</div>
    </div>`;
  _analyzeTimer=setInterval(()=>{
    const el=document.getElementById('elapsed');
    if(el) el.textContent='已用 '+((Date.now()-t0)/1000).toFixed(1)+'s'+(shot?' · 截图/读图/逐维分析中':' · 逐维分析中');
  },100);
  try{
    const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:h.id,title:h.title,source:h.source,sourceName:h.sourceName,heatText:h.heatText,context:h.extra||'',date:h.date,rank:h.rank,url:h.url,force:!!force,shot:shot?'on':'off'})});
    const d=await r.json();
    if(_analyzeTimer){ clearInterval(_analyzeTimer); _analyzeTimer=null; }
    renderReport(h,d);
  }catch(e){
    if(_analyzeTimer){ clearInterval(_analyzeTimer); _analyzeTimer=null; }
    R.innerHTML='<div class="err">分析失败：'+e.message+'</div>';
  }
}

function shotBlockHTML(d){
  if(d.shot){
    const ov=d.overview||{};
    const facts=(ov.facts||[]).filter(Boolean).map(f=>`<span class="fact">${esc(f)}</span>`).join('');
    return `<div class="shotbox">
      <div class="shotthumb">
        <img class="shotimg" src="${esc(d.shot)}" alt="热点截图" onclick="window.open('${esc(d.shot)}','_blank')" title="点击查看大图">
        <div class="shotmeta">📸 真实网页截图 · 点击放大</div>
      </div>
      <div class="ovwwrap">
        <div class="ovwt">📌 内容概述（视觉模型读图所得 · 分析依据）</div>
        ${ov.overview?`<div class="ovw">${esc(ov.overview)}</div>`:(d.shotError?`<div class="ovw">（读图未完成：${esc(d.shotError)}）</div>`:'')}
        ${facts?`<div class="facts">${facts}</div>`:''}
        ${ov.caution?`<div class="caution">${esc(ov.caution)}</div>`:''}
      </div>
    </div>`;
  }
  if(d.shotError) return `<div class="shotfail">未能取得截图/读图，本次基于标题与热度分析。原因：${esc(d.shotError)}</div>`;
  return '';
}

function renderReport(h,d){
  const ring=d.index>=60?'green':d.index>=40?'yellow':'red';
  let html='';
  if(d.llmError) html+=`<div class="warnllm">大模型调用失败，已回退本地引擎。原因：${esc(d.llmError)}</div>`;
  html+=`<div class="rhead">
      <button class="back" onclick="backToPool()">← 返回热点池</button>
      <div class="rt">${esc(h.title)}</div>
      ${d.cached?'<span style="color:var(--good);font-size:12px">⚡ 已缓存 · 秒开</span>':''}
      <button class="btn ghost" onclick="analyze(lastHot,true,true)">📸 重新截图分析</button>
      <button class="btn ghost" onclick="analyze(lastHot,true,false)">⚡快速分析（不截图）</button>
      <button class="btn ghost" onclick="window.print()">导出 / 打印</button>
    </div>
    <div class="decision">
      <div class="score-ring">
        <div class="num v.${d.riskLight==='red'?'red':d.riskLight==='yellow'?'yellow':(d.index>=60?'green':'yellow')}">${d.index}</div>
        <div class="lbl">借势指数 /100</div>
      </div>
      <div class="verdict">
        <div class="v ${d.riskLight==='red'?'red':ring}">${esc(d.conclusion)}<span class="light ${d.riskLight}">风险灯</span></div>
        <p>${esc(d.conclusionText||'')}</p>
      </div>
    </div>`;
  html+=shotBlockHTML(d);

  // 雷达 + 分组维度
  const dims=dimsArray(d.dims);
  html+=`<div class="rgrid">
    <div class="panel radar"><h4>12 维雷达 · 时效&gt;风险&gt;契合加权</h4>${radarSVG(dims)}</div>
    <div class="panel"><h4>分环节拆解 · 传播 / 受众 / 创意 / 媒介</h4><div class="glist" id="dimList">${groupSections(dims)}</div></div>
  </div>`;

  // 借势建议
  const cr=(d.creatives||[]).map(c=>`<li><b>${esc(c.title||'创意')}</b> — ${esc(c.desc||'')}</li>`).join('')||'<li>暂无</li>';
  html+=`<div class="two">
    <div class="panel"><h4>创意切入建议（可抄进 brief）</h4><ul class="sug">${cr}</ul>
      <div class="kv" style="margin-top:10px">内容形式：<b>${esc(d.contentForm||'—')}</b></div>
      <div class="kv" style="margin-top:6px">主投平台：<b>${esc(d.mainPlatform||'—')}</b></div></div>
    <div class="panel"><h4>时效窗口 & 风险清单</h4>
      <div class="kv">响应节奏：<b>${esc((d.timing&&d.timing.window)||'—')}</b></div>
      <div style="margin-top:12px"><h4 style="margin-bottom:6px">风险等级：${esc((d.risk&&d.risk.level)||'—')}</h4>
      <ul class="rk">${((d.risk&&d.risk.points)||[]).map(p=>`<li class="rk-point" style="display:list-item">${esc(p)}</li>`).join('')||'<li>—</li>'}</ul></div>
    </div>
  </div>`;

  html+=`<div class="panel"><div class="foot">
     数据来源：${esc(h.sourceName)} 榜位 #${h.rank} · 日期 ${esc(h.date||'实时')} · ${esc(h.heatText||'')} ·
     分析引擎：${d.mode==='llm'?('大模型 '+esc(d.model||'')):'本地规则引擎'} ·
     采集 ${new Date().toLocaleString('zh-CN')}
     <a href="${esc(h.url)}" target="_blank" rel="noopener">查看热点原文 ↗</a></div></div>`;
  document.getElementById('report').innerHTML=html;

  // 雷达 ↔ 维度联动
  const svg=document.getElementById('radarSvg');
  if(svg){ svg.querySelectorAll('.axis').forEach(ax=>{
    ax.addEventListener('mouseenter',()=>{const i=ax.getAttribute('data-i');hl(i);});
    ax.addEventListener('click',()=>{const i=ax.getAttribute('data-i');hl(i);
      const el=document.getElementById('dim-'+i); if(el) el.scrollIntoView({behavior:'smooth',block:'center'});});
  });}
  bindDimHover(dims);
}

function dimsArray(dm){return DIMS_DEF().map(k=>({...k,...(dm[k.key]||{})}));}
function DIMS_DEF(){return [
 {key:'source',name:'传播信源',group:'传播'},{key:'spread',name:'扩散机制',group:'传播'},{key:'lifecycle',name:'生命周期',group:'传播'},
 {key:'audience',name:'受众画像',group:'受众'},{key:'insight',name:'核心洞察',group:'受众'},{key:'emotion',name:'情绪触点',group:'受众'},
 {key:'fit',name:'品牌契合',group:'创意'},{key:'creative',name:'创意角度',group:'创意'},{key:'content',name:'内容形式',group:'创意'},
 {key:'media',name:'媒介适配',group:'媒介'},{key:'timing',name:'时效窗口',group:'媒介'},{key:'risk',name:'风险合规',group:'媒介'}
];}

function scoreColor(s){return s>=4?'var(--good)':s>=2.5?'var(--warn)':'var(--bad)';}

function dimListHTML(dims){
  let out=''; let lastG='';
  dims.forEach((d,i)=>{
    if(d.group!==lastG){ out+=`<div style="grid-column:1/-1;font-size:11px;color:var(--sub);letter-spacing:1px;margin:8px 0 2px">${GROUP_EN[d.group]}</div>`; lastG=d.group; }
    out+=`<div class="dim" id="dim-${i}" data-i="${i}">
      <div class="dh"><span class="dot" style="background:${GROUP_COLOR[d.group]}"></span>
        <span class="dn">${d.name}</span>
        ${d.tag?`<span class="tag">${esc(d.tag)}</span>`:''}</div>
      <div class="an">${esc(d.analysis||'')}</div></div>`;
  });
  return out;
}

function groupSections(dims){
  const order=['传播','受众','创意','媒介'];
  let out='';
  order.forEach(g=>{
    const items=dims.map((d,i)=>({d,i})).filter(o=>o.d.group===g);
    if(!items.length) return;
    const segs=items.map(o=>`<span class="seg" id="dim-${o.i}" data-i="${o.i}"><b>${o.d.name}</b>${o.d.tag?`<em class="stag">${esc(o.d.tag)}</em>`:''}：${esc(o.d.analysis||'')}</span>`).join(' ');
    out+=`<div class="gsec">
      <div class="gsh"><span class="dot" style="background:${GROUP_COLOR[g]}"></span>${GROUP_EN[g]}</div>
      <div class="gpara">${segs}</div>
    </div>`;
  });
  return out;
}

// ---- SVG 雷达 ----
function radarSVG(dims){
  const N=dims.length, cx=240, cy=210, R=150;
  const ang=i=>-Math.PI/2 + i*2*Math.PI/N;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];
  let grid='';
  for(let ring=1;ring<=5;ring++){
    const rr=R*ring/5;
    const ps=dims.map((_,i)=>pt(i,rr).map(v=>v.toFixed(1)).join(',')).join(' ');
    grid+=`<polygon points="${ps}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }
  let axes='',labels='';
  dims.forEach((d,i)=>{
    const [x,y]=pt(i,R);
    axes+=`<line class="axis" data-i="${i}" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" style="cursor:pointer"/>`;
    const [lx,ly]=pt(i,R+26);
    const anchor=Math.abs(lx-cx)<20?'middle':(lx>cx?'start':'end');
    labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="var(--sub)" font-size="12" text-anchor="${anchor}" dominant-baseline="middle">${d.name}</text>`;
    labels+=`<circle class="axdot" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${GROUP_COLOR[d.group]}" style="cursor:pointer"/>`;
  });
  const dataPts=dims.map((d,i)=>pt(i,R*(d.score||0)/5).map(v=>v.toFixed(1)).join(',')).join(' ');
  const dots=dims.map((d,i)=>{const[x,y]=pt(i,R*(d.score||0)/5);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${GROUP_COLOR[d.group]}"/>`;}).join('');
  return `<svg id="radarSvg" width="480" height="440" viewBox="0 0 480 440">
    ${grid}${axes}
    <polygon points="${dataPts}" fill="rgba(77,140,255,.22)" stroke="var(--accent)" stroke-width="2"/>
    ${dots}${labels}
    <text x="${cx}" y="${cy-4}" fill="var(--accent)" font-size="11" text-anchor="middle">0</text>
  </svg>`;
}

function hl(i){
  document.querySelectorAll('.seg').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('dim-'+i); if(el) el.classList.add('active');
}
function bindDimHover(dims){
  document.querySelectorAll('.seg').forEach(el=>{
    el.addEventListener('mouseenter',()=>{const i=el.getAttribute('data-i');const dot=document.querySelector(`.axdot[data-i="${i}"]`);if(dot)dot.setAttribute('r','6');});
    el.addEventListener('mouseleave',()=>{const i=el.getAttribute('data-i');const dot=document.querySelector(`.axdot[data-i="${i}"]`);if(dot)dot.setAttribute('r','3');});
  });
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---- 历史归档 ----
let _arcDatesLoaded=false;
async function openArchive(){
  document.getElementById('poolView').style.display='none';
  document.getElementById('intro').style.display='none';
  document.getElementById('report').className=''; document.getElementById('report').innerHTML='';
  const av=document.getElementById('archiveView'); av.style.display='';
  if(!_arcDatesLoaded){
    try{
      const r=await (await fetch('/api/archive/dates')).json();
      const sel=document.getElementById('arcDate'); sel.innerHTML='';
      (r.dates||[]).forEach(d=>{
        const o=document.createElement('option'); o.value=d.date;
        o.textContent=d.date+'（'+d.count+' 条'+(d.analyzed?' · 已分析 '+d.analyzed:'')+'）';
        sel.appendChild(o);
      });
      if(!r.dates||!r.dates.length){ sel.innerHTML='<option value="">暂无归档（先在实时池抓一次）</option>'; }
      _arcDatesLoaded=true;
    }catch(e){ document.getElementById('arcPool').innerHTML='<div class="err">归档读取失败：'+e.message+'</div>'; return; }
  }
  loadArchiveItems();
}
async function loadArchiveItems(){
  const date=document.getElementById('arcDate').value||'';
  const cat=document.getElementById('arcCat').value||'all';
  const q=document.getElementById('arcQ').value.trim();
  document.getElementById('arcPool').innerHTML='<div class="loading">加载归档…</div>';
  try{
    const r=await (await fetch('/api/archive?date='+encodeURIComponent(date)+'&category='+encodeURIComponent(cat)+'&q='+encodeURIComponent(q))).json();
    // 填充分类下拉（保留当前选择）
    const catSel=document.getElementById('arcCat'); const cur=catSel.value;
    catSel.innerHTML='<option value="all">全部分类</option>';
    (r.categories||[]).forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; catSel.appendChild(o); });
    catSel.value=(r.categories||[]).includes(cur)?cur:'all';
    document.getElementById('arcCnt').textContent='共 '+(r.total||0)+' 条 · 当前筛选 '+(r.count||0)+' 条';
    if(!r.items||!r.items.length){ document.getElementById('arcPool').innerHTML='<div class="err">该日期/筛选下暂无归档内容。</div>'; return; }
    renderPool(r.items,'arcPool');
  }catch(e){ document.getElementById('arcPool').innerHTML='<div class="err">归档读取失败：'+e.message+'</div>'; }
}
